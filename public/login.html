<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IBM Maximo EAM Assistant - Login</title>
  
  <!-- PWA & Mobile Web Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Maximo EAM">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      overflow: hidden;
      position: relative;
    }

    /* Fullscreen Dynamic Interactive Particle Canvas */
    #bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
    }

    /* Ambient Pulsing Glow Blobs Behind Canvas */
    .ambient-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      animation: floatOrb 22s ease-in-out infinite alternate;
    }

    .blob-1 {
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #0284c7 0%, rgba(2, 132, 199, 0) 70%);
      top: -120px;
      left: -120px;
    }

    .blob-2 {
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #4f46e5 0%, rgba(79, 70, 229, 0) 70%);
      bottom: -160px;
      right: -120px;
      animation-duration: 28s;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #06b6d4 0%, rgba(6, 182, 212, 0) 70%);
      top: 45%;
      left: 65%;
      animation-duration: 20s;
      animation-delay: -11s;
    }

    @keyframes floatOrb {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(70px, 50px) scale(1.15);
      }
      100% {
        transform: translate(-50px, 90px) scale(0.9);
      }
    }

    /* Subtle Animated Perspective Grid */
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.1) 85%);
      pointer-events: none;
      z-index: 1;
    }

    /* Glassmorphism Card with Floating Neon Border */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 430px;
      padding: 38px 34px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 18px;
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(2, 132, 199, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: cardFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Brand Header */
    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .login-badge {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #0f4876 0%, #248acc 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: #fff;
      box-shadow: 0 8px 22px rgba(36, 138, 204, 0.45);
      position: relative;
    }

    .login-badge::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 14px;
      background: linear-gradient(135deg, #248acc, #22c55e);
      z-index: -1;
      opacity: 0.6;
      filter: blur(5px);
    }

    .login-title {
      font-size: 19px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.3px;
    }

    .login-desc {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 7px;
      letter-spacing: 0.2px;
    }

    .form-input {
      width: 100%;
      background: rgba(3, 7, 18, 0.75);
      border: 1px solid rgba(51, 65, 85, 0.9);
      color: #f8fafc;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: #38bdf8;
      background: rgba(3, 7, 18, 0.95);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.22);
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
      box-shadow: 0 4px 18px rgba(2, 132, 199, 0.38);
    }

    .btn-login:hover {
      background: linear-gradient(135deg, #0ea5e9 0%, #3b82f6 100%);
      box-shadow: 0 6px 22px rgba(2, 132, 199, 0.55);
      transform: translateY(-1px);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .login-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #f87171;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      margin-bottom: 18px;
      display: none;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11.5px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Blobs -->
  <div class="ambient-glow">
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>
    <div class="glow-blob blob-3"></div>
  </div>

  <!-- Perspective Tech Grid -->
  <div class="grid-lines"></div>

  <!-- Interactive Constellation & Node Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-brand">
      <div class="login-badge">EFM</div>
      <div>
        <div class="login-title">Eden FM Assistant</div>
        <div class="login-desc">Hassan Allam Holding • Maximo Portal</div>
      </div>
    </div>

    <div id="login-error" class="login-error"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Enter username" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" id="btn-submit" class="btn-login">Sign In</button>
    </form>

    <div class="login-footer">
      Enterprise Asset Management & AI Reliability Platform
    </div>
  </div>

  <script>
    // --- Dynamic Interactive Particles & Constellation Animation ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      initParticles();
    });

    const mouse = { x: null, y: null, radius: 140 };

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    window.addEventListener('mouseout', () => {
      mouse.x = null;
      mouse.y = null;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 0.7;
        this.vy = (Math.random() - 0.5) * 0.7;
        this.color = Math.random() > 0.4 ? '#38bdf8' : '#818cf8';
        this.alpha = Math.random() * 0.5 + 0.3;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        // Bounce from boundaries
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        // Mouse interaction: gentle repulsion
        if (mouse.x !== null && mouse.y !== null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < mouse.radius) {
            const force = (mouse.radius - dist) / mouse.radius;
            this.x -= (dx / dist) * force * 3;
            this.y -= (dy / dist) * force * 3;
          }
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    let particles = [];
    function initParticles() {
      particles = [];
      const count = Math.min(Math.floor((width * height) / 11000), 100);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();

    function connectParticles() {
      const maxDist = 120;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDist) {
            const alpha = (1 - dist / maxDist) * 0.22;
            ctx.save();
            ctx.strokeStyle = `rgba(56, 189, 248, ${alpha})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
            ctx.restore();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let p of particles) {
        p.update();
        p.draw();
      }
      connectParticles();

      requestAnimationFrame(animate);
    }
    animate();

    // --- Login Form Handler ---
    const form = document.getElementById('login-form');
    const errBox = document.getElementById('login-error');
    const submitBtn = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Signing in...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (!res.ok || data.error) {
          errBox.textContent = data.error || 'Invalid username or password.';
          errBox.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerText = 'Sign In';
        } else {
          // Success: smoothly redirect to app
          window.location.href = '/';
        }
      } catch (err) {
        errBox.textContent = 'Server connection error. Please try again.';
        errBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In';
      }
    });

    // Register PWA Service Worker on login screen
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[PWA Login] Service Worker registered'))
          .catch(err => console.log('[PWA Login] Service Worker failed:', err));
      });
    }
  </script>
</body>
</html>
